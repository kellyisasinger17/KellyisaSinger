    <script src="dist/js/splide.min.js"></script>
    <script>
      const splide = new Splide( '#main-carousel', {
        pagination: false,
      } );

      const thumbnails = Array.from( document.getElementsByClassName( 'thumbnail' ) );
      let current;

      function goToSlide( index ) {
        splide.go( index );
      }

      function initThumbnail( thumbnail, index ) {
        thumbnail.addEventListener( 'click', function () {
          goToSlide( index );
        } );

        thumbnail.addEventListener( 'keydown', function ( event ) {
          if ( event.key === 'Enter' || event.key === ' ' ) {
            event.preventDefault();
            goToSlide( index );
          }
        } );
      }

      thumbnails.forEach( initThumbnail );

      function updateActiveThumbnail() {
        const thumbnail = thumbnails[ splide.index ];

        if ( thumbnail ) {
          if ( current ) {
            current.classList.remove( 'is-active' );
            current.removeAttribute( 'aria-current' );
          }

          thumbnail.classList.add( 'is-active' );
          thumbnail.setAttribute( 'aria-current', 'true' );
          current = thumbnail;
        }
      }

      splide.on( 'mounted', function () {
        const slides = document.querySelectorAll( '#main-carousel .splide__slide' );

        thumbnails.forEach( function ( thumbnail, index ) {
          if ( slides[ index ] && slides[ index ].id ) {
            thumbnail.setAttribute( 'aria-controls', slides[ index ].id );
          }
        } );

        updateActiveThumbnail();
      } );

      splide.on( 'move', updateActiveThumbnail );

      splide.mount();
    </script>

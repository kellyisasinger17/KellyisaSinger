    <nav class="site-nav">
      <div class="container position-relative">
        <a class="mobile-brand" href="index.html">Kelly Singer Lançon</a>
        <input class="nav-toggle" type="checkbox" id="navToggle">
        <label class="nav-toggle-label" for="navToggle" aria-label="Toggle navigation">☰</label>
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>

        </ul>
      </div>
    </nav>
    <main>
      <header class="page-hero"><h1>Contact</h1></header>
      <section class="card-content" aria-label="Contact form">
        <div class="container">
          <div class="contact-card">
            <form class="contact-form" action="https://formspree.io/f/mrenepyw" method="POST">
              <div class="contact-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
              </div>
              <div class="contact-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
              </div>
              <div class="contact-field">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
              </div>
              <button class="contact-submit" type="submit">Send Message</button>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer py-4 text-center">
      <a href="mailto:kelly@kellyisasinger.com">kelly@kellyisasinger.com</a>
    </footer>
  </body>
